# This workflow audits the installed dependencies for known vulnerabilities
# It is separate from python-package.yml so that a new advisory never blocks a release

name: security

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 6 * * 1"  # weekly, catches new advisories between pushes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - name: Install package
      run: |
        python -m pip install --upgrade pip pip-audit
        pip install .
    - name: Audit dependencies
      run: pip-audit
